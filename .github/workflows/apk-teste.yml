name: APK de teste

# Compila o APK de debug na nuvem. Rode manualmente em Actions > APK de teste > Run workflow,
# ou a cada push na main. O APK sai na Release "apk-teste" (terco-app-teste.apk).
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Build web e sincronizar com o Android
        run: |
          npm run build
          npx cap sync android

      - name: Compilar APK de debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # Publica numa Release (não usa a cota de Artifacts do Actions).
      # A tag fixa "apk-teste" é sobrescrita a cada execução.
      - name: Publicar APK na Release apk-teste
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk terco-app-teste.apk
          gh release view apk-teste >/dev/null 2>&1 || gh release create apk-teste \
            --title "APK de teste" \
            --notes "APK de debug para teste. Gerado automaticamente a partir da main." \
            --prerelease --target "$GITHUB_SHA"
          gh release upload apk-teste terco-app-teste.apk --clobber
